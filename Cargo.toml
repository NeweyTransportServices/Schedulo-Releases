[package]
name = "schedulo"
description = "Schedulo - the dashboard that installs, updates and opens every Schedulo app"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Newey Transport Services"]
build = "build.rs"

[[bin]]
name = "Schedulo"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
ureq = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
